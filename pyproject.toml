[project]
name = "icue-linux"
version = "0.1.0"
description = "Run Corsair iCUE HTML widgets on Linux (Xeneon Edge)"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9"]
authors = [{ name = "Martin" }]

[project.scripts]
icue-linux = "icuehost.__main__:main"

[tool.setuptools]
packages = ["icuehost", "icuehost.plugins"]

[tool.setuptools.package-data]
icuehost = ["shim.js"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
